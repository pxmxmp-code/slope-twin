name: slope-twin

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5));
          assert h['api']=='ok'
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-23002}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5
