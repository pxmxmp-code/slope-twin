name: slope-twin

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-23002}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-slope_twin}:${POSTGRES_PASSWORD:-slope_twin_password}@db:5432/${POSTGRES_DB:-slope_twin}}
      GEOSERVER_WMS_URL: ${GEOSERVER_WMS_URL:-http://host.docker.internal:8080/geoserver/ne/wms}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-slope-twin}
      TILESET_URL: ${TILESET_URL:-/tiles/tileset.json}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/TILES:/app/data/TILES:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, /opt/venv/bin/python, -c, "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); assert h['database']=='ok' and h['tileset']=='ok'"]
      interval: 15s
      timeout: 8s
      start_period: 15s
      retries: 5

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slope_twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slope_twin_password}
      POSTGRES_DB: ${POSTGRES_DB:-slope_twin}
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER:-slope_twin}" -d "$${POSTGRES_DB:-slope_twin}"']
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SERVER_URL: http://${SERVER_HOST:-192.168.1.110}:${MINIO_PORT:-29000}
      MINIO_BROWSER_REDIRECT_URL: http://${SERVER_HOST:-192.168.1.110}:${MINIO_CONSOLE_PORT:-29001}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

